name: 检查
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Bash 语法
        run: find . -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: ShellCheck
        run: shellcheck -x vps-init.sh tests/*.sh
      - name: 参数和恢复测试
        run: bash tests/test-core.sh
      - name: 真实终端菜单交互
        run: python3 tests/test-ui.py
      - name: 只读诊断
        run: |
          bash vps-init.sh check
          bash vps-init.sh network
