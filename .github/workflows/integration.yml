name: 临时虚拟机集成验证
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  access:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            mode: service
            identity: plain
          - os: ubuntu-24.04
            mode: service
            identity: plain
          - os: ubuntu-24.04
            mode: socket
            identity: plain
          - os: ubuntu-24.04
            mode: service
            identity: identity
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: 准备临时 VM 的发行版工具
        run: sudo apt-get update && sudo apt-get install -y openssh-server ufw logrotate
      - name: 测试一键流程和 SSH 恢复
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT env VPS_INIT_DISPOSABLE_VM=1 bash tests/integration-access.sh '${{ matrix.mode }}' '${{ matrix.identity }}'
      - name: 失败诊断
        if: failure()
        run: |
          sudo systemctl status ssh.service ssh.socket --no-pager || true
          sudo journalctl -u ssh.service --no-pager -n 30 || true
