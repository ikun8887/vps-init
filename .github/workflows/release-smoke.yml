name: 公开安装入口验证
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已发布版本
        required: true
        default: v0.3.0-beta.1
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 从公开地址安装、重装、卸载
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]
          curl --proto '=https' -fsSL --connect-timeout 15 --max-time 60 \
            "https://raw.githubusercontent.com/ikun8887/vps-init/$RELEASE_TAG/install.sh" -o "$RUNNER_TEMP/vps-init-install.sh"
          sudo bash "$RUNNER_TEMP/vps-init-install.sh" help
          sudo bash "$RUNNER_TEMP/vps-init-install.sh" help
          vps-init check
          sudo vps-init uninstall --yes
          test ! -e /usr/local/bin/vps-init
          test ! -e /usr/local/lib/vps-init/vps-init.sh
